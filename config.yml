# Terms only an AI story uses. On top of the `wordcount` rule a page must
# mention these at least `crawl.min_strong_mentions` times and carry one in
# its title or lede (or have a body dense with them); this keeps general
# tech articles whose site chrome says "AI" out of the dataset. Matching
# folds "A.I." to "ai".
strong_targets:
  - ai
  - artificial intelligence
  - machine learning
  - deep learning
  - neural network
