[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lostflux/functional-scraper"

[workspace.dependencies]
scraper-core = { path = "crates/core" }
scraper-net = { path = "crates/net" }
scraper-extract = { path = "crates/extract" }
scraper-store = { path = "crates/store" }
scraper-crawl = { path = "crates/crawl" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
humantime = "2"
quick-xml = "0.37"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
texting_robots = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[package]
name = "scraper"
description = "Focused, polite, parallel BFS web crawler for AI/tech articles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scraper"
path = "src/main.rs"

[dependencies]
scraper-core.workspace = true
scraper-net.workspace = true
scraper-extract.workspace = true
scraper-store.workspace = true
scraper-crawl.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
humantime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
